<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="kbn">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>kbn</title>
<style>
/* Apple Human Interface Guidelines: system colors, type scale (Dynamic Type), grouped lists, materials. */
:root{
  color-scheme:light dark;
  /* light: systemGroupedBackground / secondarySystemGroupedBackground / labels / fills */
  --bg:#f2f2f7;--cell:#fff;--cell2:#f2f2f7;--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --sep:rgba(60,60,67,.29);--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;--teal:#30b0c7;--pl:36%;
  --bar:rgba(249,249,249,.84);--menu:rgba(249,249,249,.97);--solid:#fff;--shadow:0 10px 40px rgba(0,0,0,.18);--scrim:rgba(0,0,0,.3);
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
  --curve:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--cell:#1c1c1e;--cell2:#2c2c2e;--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);
  --sep:rgba(84,84,88,.6);--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#40c8e0;--pl:72%;
  --bar:rgba(29,29,31,.8);--menu:rgba(44,44,46,.97);--solid:#1c1c1e;--shadow:0 10px 40px rgba(0,0,0,.6);--scrim:rgba(0,0,0,.5);
}}
html{font-size:17px;background:var(--bg);-webkit-text-size-adjust:100%}
@supports (font:-apple-system-body){html{font:-apple-system-body}} /* Dynamic Type: follows the iPhone text size */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",sans-serif;
  line-height:1.29;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
svg{width:1.45rem;height:1.45rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic{display:inline-flex}

/* ---------- navigation bar (inline title) + large title ---------- */
#bar{position:sticky;top:0;z-index:30;padding-top:var(--safe-t);transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
#bar.collapsed{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-bottom-color:var(--sep)}
.bar-in{height:44px;display:flex;align-items:center;padding:0 8px;position:relative}
.bar-in .l,.bar-in .r{display:flex;align-items:center;min-width:72px;z-index:1}
.bar-in .r{justify-content:flex-end;margin-left:auto}
#stitle{position:absolute;left:72px;right:72px;text-align:center;font-weight:600;font-size:1rem;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#bar.collapsed #stitle{opacity:1}
.nbtn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--blue);font-size:1rem;border-radius:22px;transition:opacity .15s}
.nbtn:active{opacity:.35}
.nbtn.txt{padding:0 8px;min-width:0}
.back{padding-left:0}
.large{margin:0;padding:2px 16px 8px;font-size:2rem;line-height:1.2;font-weight:700;letter-spacing:.01em}
#sub{position:sticky;top:calc(44px + var(--safe-t));z-index:20;background:var(--bg)}
#sub:empty{display:none}
#sub.stuck{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px)}
main{padding:6px 16px calc(100px + var(--safe-b));max-width:640px;margin:0 auto;min-height:55vh}
main.fade{animation:fade .2s ease}
@keyframes fade{from{opacity:0}}

/* ---------- tab bar ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  border-top:.5px solid var(--sep);padding:6px 4px calc(2px + var(--safe-b))}
#tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--label2);font-size:.65rem;font-weight:500;padding:2px 0;position:relative}
#tabs button svg{width:1.55rem;height:1.55rem}
#tabs button.on{color:var(--blue)}
#tabs button.on .f{fill:currentColor}
#tabs button.on .k{stroke:var(--solid)}
#tabs button.on svg.sw{stroke-width:2.4}
#tabs button:active svg{transform:scale(.88)}
.badge{position:absolute;top:-1px;left:calc(50% + 7px);background:var(--red);color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:.7rem;font-weight:600;line-height:18px;text-align:center;padding:0 5px}

/* ---------- inset grouped lists ---------- */
.sec{display:flex;align-items:baseline;gap:8px;margin:24px 16px 7px;font-size:.76rem;font-weight:500;color:var(--label2);text-transform:uppercase}
.sec:first-child{margin-top:12px}
.sec.red{color:var(--red)}.sec .n{margin-left:auto;font-weight:400}
.sec button{margin-left:auto;color:var(--blue);text-transform:none;font-size:.88rem}
.foot{margin:8px 16px 0;font-size:.76rem;color:var(--label2);text-align:center}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:44px;width:100%;text-align:left;background:var(--cell);transition:background .1s}
.group>.cell:not(:first-child)::before,.group>.swipe:not(:first-child)>.cell::before{content:"";position:absolute;top:0;left:var(--inset,16px);right:0;height:.5px;background:var(--sep);z-index:2}
button.cell:active,.cell.tap:active{background:var(--fill2)}
.cell .main{flex:1;min-width:0}
.cell .t{font-size:1rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.cell .t.done{color:var(--label2);text-decoration:line-through}
.cell .t b{font-weight:600}
.prio{color:var(--orange);font-weight:600;margin-right:6px;letter-spacing:-.05em}
.chev{color:var(--label3);flex:none;margin-right:-6px}
.chev svg{width:1.05rem;height:1.05rem;stroke-width:2.4}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:2px;font-size:.82rem;color:var(--label2)}
.pill{display:inline-block;border-radius:5px;padding:0 6px;font-size:.76rem;font-weight:600;line-height:1.5;background:hsl(var(--h,210) 75% 50%/.16);color:hsl(var(--h,210) 80% var(--pl))}
.due.late{color:var(--red)}.due.today{color:var(--orange)}
.chip{color:var(--label2)}
.check{width:1.5rem;height:1.5rem;border-radius:50%;border:1.5px solid var(--label3);flex:none;display:grid;place-items:center;color:transparent;transition:all .2s;background:transparent}
.check svg{width:.9rem;height:.9rem;stroke-width:3.2}
.check.on{background:var(--blue);border-color:var(--blue);color:#fff}
.check.hi{border-color:var(--orange)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:hsl(var(--h) 70% 55%)}
.empty{text-align:center;color:var(--label2);padding:72px 32px 0}
.empty svg{width:3.4rem;height:3.4rem;stroke-width:1.3;opacity:.55;margin-bottom:10px}
.empty b{display:block;font-size:1.29rem;color:var(--label);margin-bottom:4px;font-weight:700}

/* swipe actions */
.swipe{position:relative;overflow:hidden;background:var(--cell)}
.swipe>.cell{touch-action:pan-y;will-change:transform}
.acts{position:absolute;top:0;bottom:0;display:flex;visibility:hidden}.acts.l{left:0}.acts.r{right:0}
.act{color:#fff;font-size:.88rem;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 6px;text-align:center}
.act:active{filter:brightness(.85)}

/* ---------- controls ---------- */
.scroller{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tag{flex:none;padding:6px 14px;border-radius:18px;background:var(--fill);color:var(--label);font-size:.94rem;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.tag .n{color:var(--label2);margin-left:6px;font-weight:400}
.tag.on{background:var(--blue);color:#fff}.tag.on .n{color:rgba(255,255,255,.75)}
.navlink{display:flex;align-items:center;gap:2px;padding:0 16px 8px;color:var(--blue);font-size:1rem}
.navlink svg{width:1rem;height:1rem;stroke-width:2.4}
.seg{display:flex;position:relative;background:var(--fill);border-radius:9px;padding:2px;width:100%}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .25s var(--curve)}
@media (prefers-color-scheme:dark){.seg .thumb{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.3)}}
.seg button{flex:1;position:relative;z-index:1;padding:6px 2px;font-size:.82rem;font-weight:500;text-align:center}
.seg button.on{font-weight:600}
input,textarea,select{font:inherit;color:var(--label);background:transparent;border:0;outline:0;-webkit-appearance:none;appearance:none;width:100%;margin:0;padding:0}
input::placeholder,textarea::placeholder{color:var(--label3)}
textarea{resize:none;display:block;line-height:1.35}
input[type=date]{-webkit-appearance:auto;appearance:auto;width:auto;min-height:32px;color:var(--label)}
.cell.frm input[type=date]{margin-left:auto}
select.pick{text-align:right;text-align-last:right;color:var(--label2);padding-right:2px;cursor:pointer;direction:ltr}
.cell.frm .lbl{flex:none;min-width:5.5rem}
.cell.frm input[type=text],.cell.frm input:not([type]),.cell.frm select{flex:1;text-align:right}
.cell.frm input::placeholder{text-align:right}
.updown{color:var(--label3);flex:none;margin-left:-4px}.updown svg{width:.9rem;height:.9rem}
.cell.title{padding:12px 16px}
textarea.ttl{font-size:1.18rem;font-weight:600;line-height:1.25;min-height:2.6em}
.quick{display:flex;gap:8px;padding:8px 16px 10px;justify-content:flex-start;min-height:0}
.quick button{background:var(--fill);color:var(--blue);border-radius:15px;padding:4px 12px;font-size:.88rem;font-weight:500}
.quick button:active{opacity:.5}
.tg{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:background .25s;cursor:pointer}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s var(--curve)}
.tg:checked{background:var(--green)}.tg:checked::after{transform:translateX(20px)}
.dots{display:flex;gap:6px;flex:1;justify-content:flex-end}
.dots button{width:26px;height:26px;border-radius:50%;background:hsl(var(--h) 70% 55%);position:relative}
.dots button.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--label3)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;text-align:center}
.btn:active{opacity:.6}
.cell.center{justify-content:center;color:var(--blue);font-size:1rem}
.cell.center.red{color:var(--red)}
.cell.center:active{background:var(--fill2)}
.linkbtn{color:var(--blue);font-size:.88rem;text-transform:none}

/* search */
.search{display:flex;align-items:center;gap:10px;padding:0 16px 10px}
.field{flex:1;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:36px;color:var(--label2)}
.field svg{width:1.05rem;height:1.05rem}
.field input{font-size:1.0rem}
.search .cancel{color:var(--blue);display:none}
.search.focus .cancel{display:block}

/* diary: week strip like the Calendar app */
.days{display:flex;padding:0 8px 4px}
.days button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;font-size:.68rem;font-weight:500;color:var(--label2);text-transform:uppercase}
.days b{font-size:1.18rem;font-weight:400;width:2.3rem;height:2.3rem;display:grid;place-items:center;border-radius:50%;color:var(--label);text-transform:none}
.days .today b{color:var(--red)}
.days .on b{background:var(--label);color:var(--bg);font-weight:600}
.days .on.today b{background:var(--red);color:#fff}
.days i{width:5px;height:5px;border-radius:50%;background:var(--label3);display:block}.days i.off{opacity:0}
textarea.diary{padding:14px 16px 6px;font-size:1.0rem;line-height:1.45;min-height:40vh}
.tools{display:flex;gap:12px;align-items:center;padding:6px 16px 10px;color:var(--label2);font-size:.82rem}
.tools button{color:var(--blue);font-size:.94rem}
.tools .st{margin-left:auto}

/* week summary */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--cell);border-radius:12px;padding:12px 14px}
.stat small{display:block;font-size:.82rem;font-weight:600}
.stat b{display:block;font-size:2rem;font-weight:700;line-height:1.15;margin-top:2px}
.stat span{color:var(--label2);font-size:.76rem}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding:18px 16px 0}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.chart i{display:block;width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--green);min-height:3px}
.chart i.z{background:var(--fill2)}
.chart em{font-style:normal;font-size:.76rem;color:var(--label2)}
.chart small{font-size:.7rem;color:var(--label2);text-transform:uppercase}
.period{display:flex;align-items:center;justify-content:space-between;padding:0 0 10px;font-weight:600}

/* ---------- sheets, action sheets, alerts, toasts ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:640px;margin:0 auto;background:var(--bg);border-radius:12px 12px 0 0;
  max-height:calc(100dvh - var(--safe-t) - 10px);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:rise .5s var(--curve);overflow:hidden}
.sheet.tall{height:calc(100dvh - var(--safe-t) - 10px)}
@keyframes rise{from{transform:translateY(100%)}}
.sh-head{display:flex;align-items:center;padding:0 6px;height:56px;flex:none;position:relative;touch-action:none;border-bottom:.5px solid transparent;transition:border-color .2s}
.sh-head.line{border-bottom-color:var(--sep);background:var(--bar)}
.sh-head::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--label3)}
.sh-head h3{position:absolute;left:84px;right:84px;top:14px;margin:0;text-align:center;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:36px}
.sh-head .nbtn{margin-top:10px;position:relative;z-index:1;font-size:1rem}
.sh-head .nbtn.sv{margin-left:auto;font-weight:600}
.sh-head .nbtn[disabled]{opacity:.4}
.sh-body{overflow:auto;padding:4px 16px calc(28px + var(--safe-b));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-body .sec:first-child{margin-top:8px}
.asheet{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--safe-b));z-index:71;max-width:480px;margin:0 auto;animation:rise .45s var(--curve);display:flex;flex-direction:column;gap:8px}
.asheet .g{background:var(--menu);-webkit-backdrop-filter:saturate(180%) blur(40px);backdrop-filter:saturate(180%) blur(40px);border-radius:14px;overflow:hidden}
.asheet .g>*{display:block;width:100%;text-align:center;padding:17px 16px;font-size:1.18rem;color:var(--blue)}
.asheet .g>*+*{border-top:.5px solid var(--sep)}
.asheet .g>.hd{font-size:.82rem;color:var(--label2);padding:14px 16px;font-weight:500}
.asheet .g>button:active{background:var(--fill2)}
.asheet .red{color:var(--red)}.asheet .bold{font-weight:600}
.alert{position:fixed;left:50%;top:50%;z-index:90;width:270px;margin:-80px 0 0 -135px;background:var(--menu);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border-radius:14px;text-align:center;overflow:hidden;animation:pop .25s var(--curve)}
@keyframes pop{from{transform:scale(1.12);opacity:0}}
.alert .tx{padding:18px 16px 16px}.alert h4{margin:0 0 3px;font-size:1.0rem;font-weight:600}.alert p{margin:0;font-size:.82rem}
.alert button{display:block;width:100%;padding:12px;border-top:.5px solid var(--sep);color:var(--blue);font-size:1.0rem;font-weight:600}
.alert button:active{background:var(--fill2)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(72px + var(--safe-b));z-index:80;max-width:420px;margin:0 auto;background:var(--bar);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);animation:rise .4s var(--curve)}
.toast span{flex:1;font-size:.94rem}.toast button{color:var(--blue);font-weight:600;font-size:.94rem}

/* activity indicator + pull to refresh */
.ai{width:20px;height:20px;display:inline-block;animation:ai 1s steps(12) infinite;color:var(--label2)}
.ai svg{width:100%;height:100%;stroke-width:1.6;stroke:currentColor;fill:none}
@keyframes ai{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;padding:80px 0}.loading .ai{width:28px;height:28px}
#ptr{position:fixed;left:0;right:0;top:calc(52px + var(--safe-t));z-index:15;display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .15s}
#ptr .ai{animation-play-state:paused}#ptr.go .ai{animation-play-state:running}

/* login */
.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;max-width:420px;margin:0 auto;gap:16px}
.login img{width:84px;height:84px;border-radius:19px;margin:0 auto 4px}
.login h2{margin:0;text-align:center;font-size:1.65rem}.login p{margin:0;text-align:center;color:var(--label2);font-size:.94rem}
.errbox{color:var(--label2);text-align:center;padding:60px 20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="root"></div>
<script>
"use strict";
// ============ helpers ============
const $ = (s, r = document) => r.querySelector(s);
const root = $("#root");
// SF Symbols-style line icons; .f parts are filled when a tab is selected, .k is the glyph inside a filled shape
const ICONS = {
  today: '<circle class="f" cx="12" cy="12" r="9.2"/><path class="k" d="M8 12.5l2.7 2.7L16 9.5"/>',
  board: '<rect class="f" x="3" y="4" width="5.2" height="16" rx="1.6"/><rect class="f" x="9.9" y="4" width="5.2" height="10" rx="1.6"/><rect class="f" x="16.8" y="4" width="4.2" height="13" rx="1.6"/>',
  diary: '<path class="f" d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path class="k" d="M5 17a3 3 0 013-3h11"/>',
  notes: '<path class="f" d="M5 4h14v10l-6 6H5z"/><path class="k" d="M13 20v-5a1 1 0 011-1h5"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', chart: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
  left: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="M9 5l7 7-7 7"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  updown: '<path d="M8 9l4-4 4 4M8 15l4 4 4-4"/>',
};
function icon(name, cls) { const s = document.createElement("span"); s.className = "ic"; s.innerHTML = `<svg class="${cls || ""}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`; return s; }

  const j = await r.json().catch(() => ({}));

}

    const c = LINE.exec(lines[j]);
    if (lines[j].trim() && (lines[j].length - lines[j].trimStart().length) <= ind) break;
    if (c) lines[j] = `${c[1]}[${to}] ${c[3]}`;
  }

const VIEWS = { today: viewToday, board: viewBoard, diary: viewDiary, notes: viewNotes, search: viewSearch, week: viewWeek };
const TITLES = { today: "Hoje", board: "Quadro", diary: "Diário", notes: "Notas", search: "Buscar", week: "Semana" };
const TABS = [["today", "Hoje"], ["board", "Quadro"], ["diary", "Diário"], ["notes", "Notas"], ["search", "Buscar"]];

function go(tab) { S.tab = tab; if (tab !== "week") store.set("kbn-tab", tab); history.replaceState(null, "", "#" + tab); render(); window.scrollTo(0, 0); }

function login() {

  const msg = h("p", { style: { color: "var(--red)" } });

  root.replaceChildren(h("div", { class: "login" }, h("img", { src: "/apple-touch-icon.png", alt: "" }), h("h2", {}, "kbn"), h("p", {}, "Cole o token de ~/.config/kbn/token"),
    group(h("label", { class: "cell" }, inp)), h("button", { class: "btn", onclick: enter }, "Entrar"), msg));

let rendering = 0;
function ensureShell() {
  if ($("#shell")) return;
  root.replaceChildren(h("div", { id: "shell" },
    h("header", { id: "bar" }, h("div", { class: "bar-in" }, h("div", { class: "l", id: "left" }), h("div", { id: "stitle" }), h("div", { class: "r", id: "actions" }))),
    h("h1", { class: "large", id: "title" }), h("div", { id: "sub" }), h("main", { id: "app" }, h("div", { class: "loading" }, spinner())), h("nav", { id: "tabs" }), h("div", { id: "ptr" }, spinner())));
  const onScroll = () => { const y = window.scrollY; $("#bar").classList.toggle("collapsed", y > 36); $("#sub").classList.toggle("stuck", y > 36); };
  window.addEventListener("scroll", onScroll, { passive: true });
  // pull to refresh (touch events: the vertical drag only counts at the very top)
  let y0 = null, x0 = 0, pulled = 0; const ptr = $("#ptr");
  document.addEventListener("touchstart", (e) => { y0 = (window.scrollY <= 0 && !$(".sheet") && e.touches.length === 1) ? e.touches[0].clientY : null; x0 = e.touches[0].clientX; pulled = 0; }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (y0 == null) return; const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (dy <= 0 || Math.abs(dx) > dy) { if (dy < 0) y0 = null; return; }
    if (window.scrollY > 0) { y0 = null; return; }
    pulled = dy; ptr.style.opacity = Math.min(1, dy / 70); ptr.classList.toggle("go", dy > 70); ptr.style.transform = `translateY(${Math.min(40, dy / 3)}px)`;
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchend", () => { if (y0 == null && !pulled) return; const fire = pulled > 70; y0 = null; pulled = 0; ptr.style.opacity = fire ? 1 : 0; ptr.style.transform = ""; if (fire) render().finally(() => { ptr.style.opacity = 0; ptr.classList.remove("go"); }); else ptr.classList.remove("go"); });
}

async function render() {
  if (!token) return login();
  const my = ++rendering;
  ensureShell();
  const tab = S.tab, shell = $("#shell"), prevTab = shell.dataset.tab, y = window.scrollY;
  shell.dataset.tab = tab;
  if (prevTab !== tab) { $("#title").textContent = TITLES[tab]; $("#stitle").textContent = TITLES[tab]; }
  let v;
  try { v = await VIEWS[tab](); } catch (e) {
    if (my !== rendering || !token) return;
    $("#app").replaceChildren(h("div", { class: "errbox" }, e.message, h("div", { style: { height: "16px" } }), h("button", { class: "btn", onclick: render }, "Tentar de novo")));
    return;
  }
  if (my !== rendering) return;
  const title = v.title || TITLES[tab];
  $("#title").textContent = title; $("#stitle").textContent = title;
  $("#left").replaceChildren(...(v.back ? [h("button", { class: "nbtn back", onclick: () => go("today") }, icon("left"), v.back)] : []));
  $("#actions").replaceChildren(...(v.actions || []));
  $("#sub").replaceChildren(...(v.sub ? [v.sub] : []));
  const app = $("#app");
  app.replaceChildren(...v.body.flat(Infinity).filter(Boolean));
  if (prevTab !== tab) { app.classList.remove("fade"); void app.offsetWidth; app.classList.add("fade"); }
  $("#tabs").replaceChildren(...TABS.map(([id, label]) => h("button", { class: id === (tab === "week" ? "today" : tab) ? "on" : "", onclick: () => { if (id === S.tab) { window.scrollTo({ top: 0, behavior: "smooth" }); render(); } else go(id); } }, icon(id, id === "search" ? "sw" : ""), label, id === "today" && v.badge ? h("span", { class: "badge" }, v.badge) : null)));
  if (prevTab === tab) window.scrollTo(0, y);
}

window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== S.tab) go(t); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && token && !$(".sheet") && S.tab !== "search" && S.tab !== "diary") render(); });
render();
